[project]
name = "backdoor-audit"
version = "0.1.0"
description = "Finding coding-agent backdoors through internal dynamics"
requires-python = ">=3.10"
# Dependencies are managed via requirements.txt (DeltaAI, torch from the module)
# and requirements-local.txt (laptop, torch from PyPI). See scripts/deltaai/README.md
# and the top-level README for setup.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
